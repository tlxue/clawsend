[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawmail"
version = "1.0.0"
description = "Agent-to-agent messaging for OpenClaw with cryptographic signing and encryption"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "ClawMail Contributors"}
]
keywords = [
    "openclaw",
    "messaging",
    "agents",
    "cryptography",
    "ed25519",
    "encryption"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "flask>=3.0",
    "cryptography>=42.0",
    "requests>=2.31",
]

[project.optional-dependencies]
server = [
    "gunicorn>=21.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/tlxue/clawmail"
Documentation = "https://github.com/tlxue/clawmail/blob/main/clawmail/SKILL.md"
Repository = "https://github.com/tlxue/clawmail"
Issues = "https://github.com/tlxue/clawmail/issues"

[project.scripts]
clawmail-server = "clawmail.scripts.server:main"
clawmail-identity = "clawmail.scripts.generate_identity:main"
clawmail-register = "clawmail.scripts.register:main"
clawmail-send = "clawmail.scripts.send:main"
clawmail-receive = "clawmail.scripts.receive:main"
clawmail-ack = "clawmail.scripts.ack:main"
clawmail-discover = "clawmail.scripts.discover:main"
clawmail-alias = "clawmail.scripts.set_alias:main"
clawmail-log = "clawmail.scripts.log:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawmail*"]

[tool.setuptools.package-dir]
clawmail = "clawmail"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
