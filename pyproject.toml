[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawsend"
version = "1.0.0"
description = "Agent-to-agent messaging for OpenClaw with cryptographic signing and encryption"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "ClawSend Contributors"}
]
keywords = [
    "openclaw",
    "messaging",
    "agents",
    "cryptography",
    "ed25519",
    "encryption"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "flask>=3.0",
    "cryptography>=42.0",
    "requests>=2.31",
]

[project.optional-dependencies]
server = [
    "gunicorn>=21.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/tlxue/clawsend"
Documentation = "https://github.com/tlxue/clawsend/blob/main/clawsend/SKILL.md"
Repository = "https://github.com/tlxue/clawsend"
Issues = "https://github.com/tlxue/clawsend/issues"

[project.scripts]
clawsend-server = "clawsend.scripts.server:main"
clawsend-identity = "clawsend.scripts.generate_identity:main"
clawsend-register = "clawsend.scripts.register:main"
clawsend-send = "clawsend.scripts.send:main"
clawsend-receive = "clawsend.scripts.receive:main"
clawsend-ack = "clawsend.scripts.ack:main"
clawsend-discover = "clawsend.scripts.discover:main"
clawsend-alias = "clawsend.scripts.set_alias:main"
clawsend-log = "clawsend.scripts.log:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawsend*"]

[tool.setuptools.package-dir]
clawsend = "clawsend"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
